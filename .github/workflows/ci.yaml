name: Hello World CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Build message
        run: echo "Building the project..."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test message
        run: echo "Testing the project..."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy message
        run: echo "Deploying the demo..."
